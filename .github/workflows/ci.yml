name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.mjs && node --check player.mjs && node --check core.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: little-dojang-site
          path: dist/
          retention-days: 14
