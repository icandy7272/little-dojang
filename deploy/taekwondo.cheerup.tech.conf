server {
    listen 80;
    server_name taekwondo.cheerup.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name taekwondo.cheerup.tech;
    ssl_certificate /etc/letsencrypt/live/taekwondo.cheerup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taekwondo.cheerup.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/little-dojang/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
